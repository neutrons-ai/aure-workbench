repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=8192]
      # The scaffolded opencode.json is JSONC, not JSON. That is not a slip:
      # OpenCode's schema sets `allowComments`, and it also sets
      # `additionalProperties: false` on the root object -- so the `"$comment"`
      # array that carries the reasoning in .claude/settings.json would be
      # *rejected* there. Comments are the only way to keep the why next to the
      # rules in that file. tests/test_harness_opencode.py parses it.
      - id: check-json
        exclude: "^src/nr_workbench/templates/harness/opencode/opencode\\.json$"
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: "conda.recipe/meta.yaml"
      # Reference data is a byte-exact capture of what the reduction wrote.
      # Tidying its whitespace would make the fixtures disagree with the files
      # a user actually has on disk, which is the whole point of keeping them.
      - id: end-of-file-fixer
        exclude: "^tests/data/reference/"
      - id: trailing-whitespace
        exclude: "^tests/data/reference/"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint/
    rev: v1.38.0
    hooks:
      - id: yamllint
        # 80 chars should be enough, but don't fail if a line is longer
        args: [--config-data, '{rules: {line-length: {max: 120, level: warning}}}']
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
