# Vendored files and where they came from.
#
# Two categories, and the difference matters:
#
#   verbatim -- byte-identical copies of a shared contract. Never edited here.
#               `tools/sync_upstream.py` re-hashes these and fails on any
#               drift.
#   adapted  -- code we took and changed. Carries an attribution header at the
#               top of the file; changes are ours to maintain.
#
# `sha256` is of the file as vendored, so a local edit is detectable even
# without network access to the upstream repo.
#
# AuRE is the only genuine upstream dependency tracked here.

