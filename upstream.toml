# Vendored files and where they came from.
#
# Two categories, and the difference matters:
#
#   verbatim -- byte-identical copies of a shared contract. Never edited here.
#               `tools/sync_upstream.py` re-hashes these and fails on any
#               drift.
#   adapted  -- code we took and changed. Carries an attribution header at the
#               top of the file; changes are ours to maintain.
#
# `sha256` is of the file as vendored, so a local edit is detectable even
# without network access to the upstream repo.
#
# AuRE is the only genuine upstream dependency tracked here.

# THE SIX SKILLS ADAPTED FROM AuRE
#
# All six were adapted from AuRE at `3021fee`, which was its tip on the day they
# landed here: `neutron-reflectometry` on 2026-08-05 (b7e3155) and the other five
# together on 2026-08-06 (f11a4b5), with no AuRE commit in between. Five of them
# were previously unregistered, so this manifest described one relationship out
# of six while its report read as full coverage.
#
# **They are not drifting copies, and they are not meant to converge.** AuRE is an
# autonomous fitter: it needs facts, bounds and what to do next. nr-workbench is a
# co-scientist tool: a person judges and reports, so these carry uncertainty
# discipline, rationalizations, red flags and pre-report checklists that would be
# prompt-budget cost to an agent that cannot act on them. The consumer differs, so
# the content differs on purpose.
#
# An earlier note here said the remaining pure-AuRE skills "should be READ from
# the installed package rather than copied". That was the right instinct about
# duplication aimed at the wrong target. What must not diverge is the **numbers** --
# six SLDs quoted in these skills had drifted, two of them disagreeing with a
# density table sitting in this same package. That is now enforced by
# `tests/test_skill_slds.py`, which checks every quoted SLD against the physics.
# The prose is free to differ; the facts are not.
#
# So `sha256` is deliberately absent on all six: a hash would assert these files
# should match upstream, which is the opposite of the policy. What the entries
# record is provenance -- what this was adapted from, and when -- so
# `--remote` can report when AuRE has moved past the recorded commit and a review
# is worth doing.

