# Vendored files and where they came from.
#
# Two categories, and the difference matters:
#
#   verbatim -- byte-identical copies of a shared contract. Never edited here.
#               `tests/test_vendor.py` re-hashes these and fails on any drift.
#   adapted  -- code we took and changed. Carries an attribution header at the
#               top of the file; changes are ours to maintain.
#
# `sha256` is of the file as vendored, so a local edit is detectable even
# without network access to the upstream repo.

[[verbatim]]
dest = "src/nr_workbench/_vendor/result_manifest.py"
repo = "neutrons-ai/nr-analyzer"
path = "analyzer_tools/result_manifest.py"
commit = "b09e2e43eaae5a7a97ce24fbee22b389f801eea3"
sha256 = "e341a23846c5370e6eda67cfa85ce7038c073ebbb461cc62fa1edf9004624075"
synced = "2026-08-05"
reason = """
The ndip-tool-result/1 manifest is already shared byte-identical across
analyzer_tools, data-assembler and nr_isaac_format. It is the interop seam:
any orchestrator that can drive nr-analyzer can drive nr-workbench unchanged.
"""

