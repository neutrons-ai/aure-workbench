name: Nightly refl1d

# The generated scripts are committed and expected to keep running. refl1d and
# bumps are pinned <2, but they still move inside that range, and the failure
# mode we care about is a scientist discovering it mid-beamtime. Running the
# integration suite and the numerical gate against the latest release turns
# that into a CI failure with a name on it.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the newest refl1d and bumps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade "refl1d<2" "bumps<2"
          python -c "import refl1d, bumps; print('refl1d', refl1d.__version__, 'bumps', bumps.__version__)"

      - name: Full suite, integration included
        run: pytest -q

      - name: The numerical gate
        # Reproducing the reference model to 1e-9 is what says the generator
        # still expresses the hardest real model this group has.
        run: pytest tests/test_model_gate.py -q

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly refl1d/bumps run failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly-refl1d',
            });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The suite passes on the pinned versions but fails on the latest',
              'refl1d/bumps within the `<2` range. Committed generated scripts are',
              'expected to keep running, so this needs a look before anyone hits it',
              'during a beamtime.',
              '', url,
            ].join('\n');
            if (!existing.data.length) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly-refl1d'],
              });
            }
