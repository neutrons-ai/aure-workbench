name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    # Run the exact same pinned hooks (ruff lint + ruff format + gitleaks + ...)
    # that developers run locally, so "passes locally" and "passes CI" always agree.
    - name: Run pre-commit on all files
      run: pre-commit run --all-files --show-diff-on-failure
