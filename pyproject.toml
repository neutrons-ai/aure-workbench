[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-workbench"
version = "0.1.0"
description = "Project workbench for neutron reflectometry analysis at SNS REF_L (BL-4B)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mat Doucet", email = "doucetm@ornl.gov" }]
keywords = [
  "neutron",
  "reflectometry",
  "refl1d",
  "time-resolved",
  "provenance",
  "agent-skills",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

# Core dependencies. Deliberately fat: `pip install nr-workbench` into a fresh
# venv must give a scientist a working REF_L analysis environment.
#
# `bumps` is declared explicitly even though refl1d pulls it in -- we import it
# directly, and an undeclared transitive dependency is a trap.
#
# AuRE is pinned by SHA, not tag: its v0.1.0 and v0.1.1 tags point at the same
# commit, v0.1.3 trails main by months, and every build reports version
# "0.1.0", so pip's resolver cannot tell them apart. Because this is a PEP 508
# direct reference, nr-workbench is install-from-git (not PyPI) until aure
# publishes -- see docs/ground_truths.md.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pydantic>=2.4",
  "click>=8.1",
  "jinja2>=3.1",
  "flask>=3.0",
  "markdown-it-py>=3.0",
  "python-dotenv>=1.0",
  "refl1d>=1.0,<2",
  "bumps>=1.0,<2",
  "aure @ git+https://github.com/neutrons-ai/aure.git@3021fee37294b938134d052e16dac4f9c282e97f",
]

[project.optional-dependencies]
nexus = ["h5py>=3.9"]
# The ISAAC schema mapping lives upstream: data-assembler produces neutral
# typed records, nr-isaac-format maps them and talks to the Portal. Both are
# git references, so this extra cannot go to PyPI -- which nr-workbench cannot
# anyway while `aure` is pinned the same way.
isaac = [
  "nr-isaac-format @ git+https://github.com/isaac-neutrons/nr-isaac-format.git",
  "data-assembler @ git+https://github.com/isaac-neutrons/data-assembler.git",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.15",
  "pre-commit>=3.4",
  "pip-audit>=2.7",
]
docs = ["mkdocs-material>=9.5", "sphinx>=7.2", "myst-parser>=2.0"]
all = ["nr-workbench[nexus,isaac,dev,docs]"]

[project.urls]
Homepage = "https://github.com/neutrons-ai/nr-workbench"
Repository = "https://github.com/neutrons-ai/nr-workbench"
Issues = "https://github.com/neutrons-ai/nr-workbench/issues"

[project.scripts]
nr-workbench = "nr_workbench.cli:main"
nrw = "nr_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nr_workbench*"]

# Skills and templates are DATA, not modules -- they have no __init__.py, so
# `packages.find` will not carry them. Without these globs they vanish from the
# wheel and `nrw init` silently installs nothing. tests/test_packaging.py builds
# a wheel and asserts they are present.
#
# The dot-prefixed patterns are not redundant: `**/*` follows glob semantics, so
# it matches neither hidden files nor anything inside a hidden directory. Left
# to `templates/**/*` alone, the scaffold ships without .gitignore,
# .github/copilot-instructions.md and .vscode/settings.json -- an installed
# nr-workbench would then produce projects with no Copilot instructions and no
# editor schema wiring, while an editable install looked perfectly fine.
[tool.setuptools.package-data]
nr_workbench = [
  "py.typed",
  "skills/**/*",
  "skills/**/.*",
  "templates/**/*",
  "templates/**/.*",
  "templates/*/.*/**/*",
  "templates/*/.*/*",
  "codegen/templates/*",
  "web/templates/*",
  "web/static/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src/nr_workbench",
  "--cov-report=term-missing",
  "--cov-report=html",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "needs_aure: requires the optional aure extra to be installed",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

# Ruff handles BOTH linting and formatting here (`ruff check` + `ruff format`).
# No black -- see .github/copilot-instructions.md, "Technology Stack Preferences".
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# _vendor/ holds byte-identical copies of contracts shared across the
# neutron-ai repos. Formatting them would fork a shared file for cosmetic
# reasons -- and `ruff format .` did exactly that once, caught by
# tests/test_vendor.py. Excluded so it cannot happen again.
extend-exclude = [
  "src/nr_workbench/_vendor",
  # The vendored hand-written reference the model gate compares against. It
  # is kept verbatim on purpose: reformatting it would weaken the comparison
  # and obscure what the generator is being measured against.
  "tests/data/reference",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long (handled by the formatter)
  "B008", # function calls in argument defaults (click uses these)
  "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S101"]
# The tNR modules hold numerics moved byte-for-byte from experiments-2025.
# Adding `strict=` to those zips would change behaviour -- raising instead of
# truncating -- in code the characterization tests pin exactly. Left alone
# deliberately; see docs/ground_truths.md.
"src/nr_workbench/tnr/ascii.py" = ["B905"]
"src/nr_workbench/tnr/plots.py" = ["B905"]
# ConstraintForm's classmethods define the interface subclasses implement; a
# form that does not need `constraint` or `context` still has to accept them.
"src/nr_workbench/spec/constraints.py" = ["ARG003"]

[tool.ruff.lint.isort]
known-first-party = ["nr_workbench"]
